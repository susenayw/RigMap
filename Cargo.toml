[package]
name = "rigmap"
version = "0.1.0"
edition = "2021"
description = "RigMap — Lightweight Windows 11 Task Manager & System Spec Inspector in pure Rust with WinUI 3 Fluent styling & Mica backdrop"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
egui_extras = "0.29"
egui_plot = "0.29"
sysinfo = "0.32"
window-vibrancy = "0.5"
raw-window-handle = "0.6"
winreg = "0.52"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
